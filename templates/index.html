<!DOCTYPE html>
<html>
  <head>
    <title>STUDY AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <div class= "container">
        <h1>Your Notes</h1>
        <p class = "subtitle"> Paste your notes and get an instant summary.</p>
        <form action="/summarize" method = "POST" enctype="multipart/form-data">
          <p style="margin: 12px 0 8px; color:#64748b; ">Or upload a PDF</p>"
          <input type="file" name="pdf" accept=".pdf">
            <textarea name = "notes" rows="12" placeholder="Paste your lecture notes here..."></textarea>
            <br>
            <select name="mode">
                <option value ="summary">Summarize</option>
                <option value ="quiz">Quiz Me</option>
                <option value ="flashcards">Flashcards</option>
                <option value ="practice">Practice Quiz (untimed)</option>
                <option value="exam">Exam-Style Questions</option>
            </select>
            <br>
            <button type="submit">Generate </button>
        </form>
      </div>{{ notes | safe }}</div>
  </body>
</html>
